name: Linux diagnostics smoke checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'diagnostics/**'
      - 'tools/diagnostics/**'
      - 'tests/**'
      - 'linux_rdaccess_core/**'
      - '*.py'
      - 'scripts/linux/**'
      - '.github/workflows/linux-diagnostics.yml'
      - '.github/workflows/chromium-selection-contract.yml'
      - 'docs/upstream/chromium-unicode-selection.diff'
  push:
    branches: [main, refactor/root-python-cleanup, refactor/repository-structure]
    paths:
      - 'diagnostics/**'
      - 'tools/diagnostics/**'
      - 'tests/**'
      - 'linux_rdaccess_core/**'
      - '*.py'
      - 'scripts/linux/**'
      - '.github/workflows/linux-diagnostics.yml'
      - '.github/workflows/chromium-selection-contract.yml'
      - 'docs/upstream/chromium-unicode-selection.diff'
  workflow_dispatch:

jobs:
  diagnostic-smoke:
    name: Linux diagnostic scripts (Python 3 / Xvfb)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install test desktop dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libx11-6 libxtst6 python3-gi python3-louis orca gir1.2-atspi-2.0 gir1.2-gtk-3.0 libatk-adaptor at-spi2-core dbus-x11 xfwm4 xdotool x11-utils
      - name: Check all diagnostic scripts compile
        run: |
          python3 -m compileall -q diagnostics
      - name: Validate diagnostic CLI help without starting listeners
        run: |
          python3 diagnostics/atspi/atspi_probe.py --help
          python3 diagnostics/atspi/atspi_event_probe.py --help
          python3 diagnostics/x11/live_x11.py --help
          python3 diagnostics/x11/tab_trace.py --help
          python3 diagnostics/nvda/nvda_speech_probe.py --help
      - name: Check X11 diagnostic in isolated display
        run: |
          xvfb-run -a sh -c 'python3 diagnostics/x11/live_x11.py --display "$DISPLAY"'
      - name: Verify real GTK controls and AT-SPI focus events
        shell: bash
        env:
          LRD_SMOKE_ARTIFACTS: ${{ github.workspace }}/gtk-smoke-evidence
        run: |
          set -o pipefail
          timeout 150s python3 tools/diagnostics/gtk_atspi_smoke.py 2>&1 | tee gtk-atspi.log

      - name: Preserve GTK activation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtk-diagnostic-results
          path: |
            gtk-atspi.log
            gtk-smoke-evidence/
          if-no-files-found: ignore

      - name: Check package and legacy bridge entry points with system AT-SPI
        run: |
          python3 -m linux_rdaccess_core.accessibility.atspi_nvda_bridge --help
          python3 -m linux_rdaccess_core.accessibility.atspi_nvda_braille_bridge --help
          python3 atspi_nvda_bridge.py --help
          python3 atspi_nvda_braille_bridge.py --help
      - name: Validate MCP diagnostics unit tests
        run: |
          python3 -m unittest discover -s tests/unit/mcp -p 'test_*.py' -v

      - name: Full suite with Linux accessibility libraries
        run: xvfb-run -a python3 -m unittest discover -s tests -t .
      - name: Run existing diagnostics-related regression tests
        run: |
          xvfb-run -a python3 -m unittest -v \
            tests.integration.x11.test_live_x11 \
            tests.integration.x11.test_xkb_lock_state \
            tests.unit.accessibility.test_tab_trace \
            tests.unit.accessibility.test_nvda_speech_probe

  chromium-selection-contract:
    name: Chromium pinned source selection contract (not upstream gtests)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify full Chromium gtest runner syntax and help
        shell: bash
        run: |
          bash -n scripts/linux/run_chromium_selection_gtests.sh
          bash scripts/linux/run_chromium_selection_gtests.sh --help
          if bash scripts/linux/run_chromium_selection_gtests.sh "$RUNNER_TEMP/nonexistent-chromium"; then
            echo 'ERROR: runner accepted a missing Chromium checkout' >&2
            exit 1
          fi
      - name: Verify pinned Chromium source and patch
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/chromium-source-contract"
          mkdir -p "$root/original/ui/accessibility/platform" "$root/candidate/ui/accessibility/platform"
          base="https://raw.githubusercontent.com/chromium/chromium/150.0.7871.250/ui/accessibility/platform"
          for filename in ax_platform_node_auralinux.cc ax_platform_node_auralinux_unittest.cc; do
            curl --fail --location --retry 3 "$base/$filename" -o "$root/original/ui/accessibility/platform/$filename"
          done
          printf '%s  %s\n' \
            '1d50dc6645c011e6fa2f036c2b08f7bb35967a60dbda12d52d55e901e8dd731f' "$root/original/ui/accessibility/platform/ax_platform_node_auralinux.cc" \
            'f18932d4de877d2074b541b4b77bfb9321e4292c5bf62df5a3d32c96481af540' "$root/original/ui/accessibility/platform/ax_platform_node_auralinux_unittest.cc" \
            | sha256sum --check | tee "$root/source-hashes.log"
          cp -a "$root/original/." "$root/candidate/"
          git -C "$root/candidate" apply --check "$GITHUB_WORKSPACE/docs/upstream/chromium-unicode-selection.diff"
          git -C "$root/candidate" apply "$GITHUB_WORKSPACE/docs/upstream/chromium-unicode-selection.diff"
          python3 -m unittest -v \
            tests.unit.accessibility.test_chromium_selection_contract \
            tests.unit.accessibility.test_vscode_native_selection_matrix \
            tests.unit.accessibility.test_electron_native_find_probe \
            2>&1 | tee "$root/unit.log"
          python3 tools/diagnostics/chromium_selection_contract.py \
            --source "$root/original/ui/accessibility/platform/ax_platform_node_auralinux.cc" \
            --patch docs/upstream/chromium-unicode-selection.diff \
            --output "$root/contract" 2>&1 | tee "$root/contract.log"
      - name: Preserve extracted-source results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-selection-contract-evidence
          path: ${{ runner.temp }}/chromium-source-contract/
          if-no-files-found: warn
