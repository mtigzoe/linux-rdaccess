name: NVDA-Orca compatibility contracts

on:
  pull_request:
    paths:
      - "linux_rdaccess_core/**"
      - "tests/**"
      - "tools/diagnostics/compatibility_contracts.py"
      - ".github/workflows/nvda-orca-compatibility.yml"
  push:
    branches: [main]
    paths:
      - "linux_rdaccess_core/**"
      - "tests/**"
      - "tools/diagnostics/compatibility_contracts.py"
      - ".github/workflows/nvda-orca-compatibility.yml"
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvda-orca-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: ${{ matrix.area }} behavioral contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - area: keyboard-and-browse
            modules: "tests.unit.accessibility.test_browser_command_context tests.unit.input.test_pass_next tests.unit.input.test_structural_list_ownership"
          - area: braille
            modules: "tests.unit.braille.test_braille_display_lifecycle tests.unit.braille.test_braille_cell_alignment tests.unit.braille.test_braille_routing_speech"
          - area: speech-and-focus
            modules: "tests.unit.accessibility.test_say_all_presentation_lifetime"
          - area: remote-protocol
            modules: "tests.integration.test_nvda_remote_loopback"
    steps:
      - uses: actions/checkout@v4
      - name: Set up distro Python and accessibility dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-gi gir1.2-atspi-2.0 python3-louis liblouis-data orca
          python3 --version
      - name: Verify test inventory and run behavioral contracts
        shell: bash
        env:
          COMPAT_AREA: ${{ matrix.area }}
          COMPAT_MODULES: ${{ matrix.modules }}
        run: |
          set -o pipefail
          mkdir -p compatibility-results
          python3 tools/diagnostics/compatibility_contracts.py \
            --area "$COMPAT_AREA" --modules "$COMPAT_MODULES" \
            2>&1 | tee "compatibility-results/$COMPAT_AREA.log"
      - name: Upload contract results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ matrix.area }}
          path: compatibility-results/
          if-no-files-found: warn
