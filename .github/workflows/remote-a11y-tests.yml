name: Remote A11Y prototype tests

on:
  pull_request:
    paths:
      - "a11y_link.py"
      - "a11y_model.py"
      - "atspi_nvda_braille_bridge.py"
      - "tests/test_a11y_link.py"
      - "tests/test_a11y_model.py"
      - ".github/workflows/remote-a11y-tests.yml"
  push:
    branches:
      - "feature/remote-a11y-objects"
    paths:
      - "a11y_link.py"
      - "a11y_model.py"
      - "tests/test_a11y_link.py"
      - "tests/test_a11y_model.py"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run remote A11Y unit tests
        run: |
          python -m unittest -v tests.test_a11y_link tests.test_a11y_model
