name: Remote A11Y prototype tests

on:
  pull_request:
    paths:
      - "a11y_link.py"
      - "a11y_model.py"
      - "atspi_nvda_braille_bridge.py"
      - "tests/test_a11y_link.py"
      - "tests/test_a11y_model.py"
      - "tools/generate_remote_a11y_fixture.py"
      - "tools/generate_remote_a11y_role_matrix.py"
      - "tools/generate_remote_a11y_state_matrix.py"
      - "tools/generate_remote_a11y_navigation_fixture.py"
      - "tools/generate_remote_a11y_action_fixture.py"
      - "tools/decode_remote_a11y_action.py"
      - "tools/generate_remote_a11y_text_fixture.py"
      - ".github/workflows/remote-a11y-tests.yml"
  push:
    branches:
      - "feature/remote-a11y-objects"
      - "feature/remote-a11y-navigation"
      - "feature/remote-a11y-actions"
      - "feature/remote-a11y-text"
    paths:
      - "a11y_link.py"
      - "a11y_model.py"
      - "atspi_nvda_braille_bridge.py"
      - "tests/test_a11y_link.py"
      - "tests/test_a11y_model.py"
      - "tools/generate_remote_a11y_fixture.py"
      - "tools/generate_remote_a11y_role_matrix.py"
      - "tools/generate_remote_a11y_state_matrix.py"
      - ".github/workflows/remote-a11y-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Linux producer
        uses: actions/checkout@v4
      - name: Checkout rdAccess consumer
        uses: actions/checkout@v4
        with:
          repository: mtigzoe/rdAccess
          ref: feature/remote-a11y-text
          path: rdAccess
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Linux remote A11Y unit tests
        run: |
          python -m unittest -v tests.test_a11y_link tests.test_a11y_model
      - name: Generate Linux semantic fixtures
        run: |
          python tools/generate_remote_a11y_fixture.py > linux-a11y-fixture.json
          python tools/generate_remote_a11y_role_matrix.py > linux-a11y-role-matrix.json
          python tools/generate_remote_a11y_state_matrix.py > linux-a11y-state-matrix.json
          python tools/generate_remote_a11y_navigation_fixture.py > linux-a11y-navigation.json
          python tools/generate_remote_a11y_action_fixture.py > linux-a11y-action.json
          python tools/generate_remote_a11y_text_fixture.py > linux-a11y-text.json
      - name: Verify Linux to rdAccess semantic contract
        run: |
          python rdAccess/tests/remote_a11y_contract.py linux-a11y-fixture.json linux-a11y-role-matrix.json linux-a11y-state-matrix.json linux-a11y-navigation.json linux-a11y-action.json linux-a11y-text.json

      - name: Verify rdAccess action request is accepted by Linux
        shell: bash
        run: |
          PYTHONPATH=rdAccess/addon python - <<'PY' > rdaccess-action.json
          from lib.a11y import encodeActionRequest
          import sys
          sys.stdout.buffer.write(encodeActionRequest("remote-button", 1))
          PY
          python tools/decode_remote_a11y_action.py < rdaccess-action.json > decoded-action.json
          python - <<'PY'
          import json
          with open("decoded-action.json", encoding="utf-8") as f:
              decoded = json.load(f)
          assert decoded == {"object_id": "remote-button", "action_index": 1}
          PY
