name: Remote A11Y prototype tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "feature/remote-a11y-objects"
      - "feature/remote-a11y-navigation"
      - "feature/remote-a11y-actions"
      - "feature/remote-a11y-text"
      - "feature/nvda-remote-*"
      - "feature/nvda-orca-*"
      - "fix/*"
    paths:
      - "*.py"
      - "*.sh"
      - "diagnostics/*.py"
      - "tests/**"
      - "a11y_link.py"
      - "a11y_model.py"
      - "atspi_nvda_braille_bridge.py"
      - "tests/unit/accessibility/test_a11y_link.py"
      - "tests/unit/accessibility/test_a11y_model.py"
      - "tools/generate_remote_a11y_fixture.py"
      - "tools/generate_remote_a11y_role_matrix.py"
      - "tools/generate_remote_a11y_state_matrix.py"
      - ".github/workflows/remote-a11y-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - name: Checkout Linux producer
        uses: actions/checkout@v4
      - name: Checkout rdAccess consumer
        uses: actions/checkout@v4
        with:
          repository: mtigzoe/rdAccess
          ref: main
          path: rdAccess
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run Linux remote A11Y unit tests
        run: |
          python -m unittest -v \
            tests.unit.accessibility.test_a11y_link \
            tests.unit.accessibility.test_a11y_model \
            tests.unit.transport.test_nvda_remote_check \
            tests.test_remote_access \
            tests.unit.transport.test_linux_rdaccess
          python -m py_compile nvda_remote_check.py remote_access.py linux_rdaccess.py tests/unit/transport/test_nvda_remote_check.py tests/test_remote_access.py tests/unit/transport/test_linux_rdaccess.py
      - name: Run pre-live compatibility smoke contracts
        run: |
          python -m unittest -v \
            tests.unit.accessibility.test_control_pattern_contracts \
            tests.unit.accessibility.test_prelive_fixtures
          python tests/apps/accessibility_smoke_app.py --list-controls > prelive-control-matrix.json
          python -m json.tool prelive-control-matrix.json > /dev/null

      - name: Key-injection latency test on a real X server
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libxtst6
          xvfb-run -a python -m unittest -v tests.integration.x11.test_xtest_injection tests.integration.x11.test_live_x11

      - name: Run full repository test suite and compile check
        run: |
          python -m unittest discover -s tests -t . -v
          # The checked-out Windows consumer uses Python 3.12 syntax; only
          # Linux producer/runtime files have the Mint Python 3.10 target.
          python -m compileall -q -x '(^|/)rdAccess/' .

      - name: Generate Linux semantic fixtures
        run: |
          python tools/generate_remote_a11y_fixture.py > linux-a11y-fixture.json
          python tools/generate_remote_a11y_role_matrix.py > linux-a11y-role-matrix.json
          python tools/generate_remote_a11y_state_matrix.py > linux-a11y-state-matrix.json
          python tools/generate_remote_a11y_navigation_fixture.py > linux-a11y-navigation.json
          python tools/generate_remote_a11y_action_fixture.py > linux-a11y-action.json
          python tools/generate_remote_a11y_text_fixture.py > linux-a11y-text.json
      - name: Verify Linux to rdAccess semantic contract
        run: |
          python rdAccess/tests/remote_a11y_contract.py linux-a11y-fixture.json linux-a11y-role-matrix.json linux-a11y-state-matrix.json linux-a11y-navigation.json linux-a11y-action.json linux-a11y-text.json

      - name: Verify rdAccess action request is accepted by Linux
        shell: bash
        run: |
          PYTHONPATH=rdAccess/addon python - <<'PY' > rdaccess-action.json
          from lib.a11y import encodeActionRequest
          import sys
          sys.stdout.buffer.write(encodeActionRequest("remote-button", 1))
          PY
          python tools/decode_remote_a11y_action.py < rdaccess-action.json > decoded-action.json
          python - <<'PY'
          import json
          with open("decoded-action.json", encoding="utf-8") as f:
              decoded = json.load(f)
          assert decoded == {"object_id": "remote-button", "action_index": 1}
          PY

      - name: Verify A11Y heartbeat contract
        shell: bash
        run: |
          PYTHONPATH=rdAccess/addon python - <<'PY' > rdaccess-pong.json
          from lib.a11y import decodeMessage, encodePong, PingMessage
          import sys
          msg = decodeMessage({"type": "a11y_ping", "nonce": 23})
          assert isinstance(msg, PingMessage)
          sys.stdout.buffer.write(encodePong(msg.nonce))
          PY
          python - <<'PY'
          import json
          from a11y_link import decode_pong
          with open("rdaccess-pong.json", encoding="utf-8") as f:
              message = json.load(f)
          assert decode_pong(message) == 23
          PY
