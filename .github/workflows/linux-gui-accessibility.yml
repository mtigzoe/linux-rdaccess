name: Linux GUI accessibility integration

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/linux-gui-accessibility.yml'
      - 'tools/diagnostics/**'
      - 'tests/apps/**'
      - 'linux_rdaccess_core/**'
      - 'a11y_model.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/linux-gui-accessibility.yml'
      - 'tools/diagnostics/**'
      - 'tests/apps/**'
      - 'linux_rdaccess_core/**'
      - 'a11y_model.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gtk-and-xfce:
    name: Real Linux GUI / AT-SPI (Ubuntu Xvfb)
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated XFCE/AT-SPI testing dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            xvfb xauth dbus-x11 xfwm4 xdotool \
            python3-gi gir1.2-atspi-2.0 gir1.2-gtk-3.0 \
            at-spi2-core libatk-adaptor thunar mousepad
      - name: Compile GUI tests
        run: |
          python3 -m py_compile tools/diagnostics/gtk_atspi_smoke.py tools/diagnostics/real_gui_atspi_smoke.py
      - name: Run GTK controls and AT-SPI semantic event checks
        run: |
          timeout 180s python3 tools/diagnostics/gtk_atspi_smoke.py
      - name: Run Thunar and Mousepad GUI AT-SPI checks
        run: |
          timeout 100s dbus-run-session -- xvfb-run -a python3 tools/diagnostics/real_gui_atspi_smoke.py
